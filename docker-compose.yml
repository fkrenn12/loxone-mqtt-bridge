services:
  loxone-mqtt-bridge:
    build:
      context: ./src
    # image: fkrenn12/loxone-mqtt-bridge
    container_name: loxone-mqtt-bridge
    restart: always
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    environment:
      - API_PORT=${API_PORT:-5602}
      - UDP_PORT=${UDP_PORT:-4444}
      - LOXONE_IP=${LOXONE_IP:-}
      - TZ=${TZ:-UTC}
    ports:
      - ${API_PORT:-5602}:${API_PORT:-5602}
      - ${UDP_PORT:-4444}:${UDP_PORT:-4444}/udp
    volumes:
      - ${SRC_MOUNT:-loxone_config:/usr/src/config} # mounting twice is ok
      - loxone_config:/usr/src/config
    # gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:5602 main:app
    command:
      - /bin/sh
      - -c
      - |
        cd /usr/src/app
        uvicorn main:app ${RELOAD:-} --workers 1 --host "0.0.0.0" --port ${API_PORT:-5602} --proxy-headers
    networks:
      - backnet

networks:
  backnet:

volumes:
  loxone_config:


